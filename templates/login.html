<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Kutit</title>
<link href="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body class="login-body">

<div class="card shadow login-card">
  <div class="card-body p-4">
    <div class="text-center mb-3">
      <div class="login-icon"><i class="fas fa-cut"></i></div>
      <h1 class="h4 mb-0">Kutit</h1>
      <p class="text-muted small">Panel interno — Clever CNC</p>
    </div>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/dashboard/login">
      <div class="form-group">
        <label for="api_key">API key</label>
        <input type="password" class="form-control" id="api_key" name="api_key" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
  </div>
</div>

</body>
</html>
